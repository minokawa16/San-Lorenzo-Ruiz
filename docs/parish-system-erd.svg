  <text class="subtitle" x="48" y="1045">Note: MySQL currently enforces only 7 foreign keys. Dashed links are likely ERD relationships based on columns such as user_id, request_id, admin_id, announcement_id, and uploaded_by.</text>
  <text class="subtitle" x="48" y="1073">For a normalized ERD, consider adding actual foreign key constraints for the dashed relationships after checking existing data consistency.</text>
