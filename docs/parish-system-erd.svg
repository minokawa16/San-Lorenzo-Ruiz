<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <style>
      .bg { fill: #f7f7f4; }
      .title { font: 700 34px Arial, sans-serif; fill: #24312f; }
      .subtitle { font: 16px Arial, sans-serif; fill: #55605d; }
      .box { fill: #ffffff; stroke: #2f4f4a; stroke-width: 2; rx: 8; }
      .box.core { fill: #edf7f2; stroke: #1f6b4b; }
      .box.record { fill: #fff7e8; stroke: #9c6718; }
      .box.system { fill: #eef2fb; stroke: #4d679c; }
      .head { font: 700 17px Arial, sans-serif; fill: #182522; }
      .field { font: 13px Arial, sans-serif; fill: #33403d; }
      .note { font: 12px Arial, sans-serif; fill: #66706d; }
      .line { fill: none; stroke: #1f6b4b; stroke-width: 2.2; marker-end: url(#arrow); }
      .inferred { fill: none; stroke: #9c6718; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow2); }
      .poly { fill: none; stroke: #7a5b9a; stroke-width: 2; stroke-dasharray: 3 5; marker-end: url(#arrow3); }
      .legend-box { fill: #ffffff; stroke: #d2d8d5; stroke-width: 1.5; rx: 8; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f6b4b" />
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9c6718" />
    </marker>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7a5b9a" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1120" />
  <text class="title" x="48" y="58">Parish Management System ERD</text>
  <text class="subtitle" x="48" y="86">Database: parish_management_system | 24 tables | solid lines = enforced foreign keys, dashed lines = inferred relationships</text>

  <g transform="translate(1215,35)">
    <rect class="legend-box" x="0" y="0" width="330" height="96" />
    <line class="line" x1="18" y1="28" x2="92" y2="28" />
    <text class="note" x="110" y="32">Actual MySQL foreign key</text>
    <line class="inferred" x1="18" y1="56" x2="92" y2="56" />
    <text class="note" x="110" y="60">Inferred by matching id columns</text>
    <line class="poly" x1="18" y1="80" x2="92" y2="80" />
    <text class="note" x="110" y="84">Polymorphic reference</text>
  </g>

