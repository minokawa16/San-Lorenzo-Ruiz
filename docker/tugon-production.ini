display_errors=Off
display_startup_errors=Off
log_errors=On
expose_php=Off
html_errors=Off
session.use_strict_mode=1
session.use_only_cookies=1
session.cookie_secure=1
session.cookie_httponly=1
session.cookie_samesite="Lax"
session.gc_maxlifetime=1800
upload_max_filesize=10M
; Registration submits three protected camera captures as base64 form fields.
; This preserves the localhost workflow while individual decoders retain their
; existing 10 MiB validation ceiling.
post_max_size=45M
max_execution_time=60
max_input_time=60
memory_limit=256M
date.timezone="Asia/Manila"
