ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory "/var/www/html">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# These contain private data or server-side implementation files. PHP may
# access them from the filesystem, but Apache must never serve them directly.
<DirectoryMatch "^/var/www/html/(uploads|storage|backups|logs|config|database|includes|services|repositories|controllers|templates|vendor|docker|tools)(/|$)">
    Require all denied
</DirectoryMatch>

<LocationMatch "^/(?:uploads|storage|backups|logs|config|database|includes|services|repositories|controllers|templates|vendor|docker|tools)(?:/|$)">
    Require all denied
</LocationMatch>

<FilesMatch "^(\.env(?:\..*)?|composer\.(?:json|lock)|Dockerfile|\.dockerignore|\.gitignore)$">
    Require all denied
</FilesMatch>

<LocationMatch "^/(?:debug-login|fix-password|helloworld|setup-database|verify-login|verify-setup)\.php$">
    Require all denied
</LocationMatch>
