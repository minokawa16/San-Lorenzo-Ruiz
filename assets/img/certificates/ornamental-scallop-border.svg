<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 650" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <style>
      .scallop-line { stroke: #006eb3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .scallop-fill { fill: #006eb3; }
      .scallop-accent { stroke: #006eb3; fill: #e8f4fc; }
    </style>

    <!-- Horizontal Scallop/Fan Unit (Width: 24, Height: 26) -->
    <pattern id="scallop-fan-top" width="24" height="26" patternUnits="userSpaceOnUse">
      <!-- Fan Arch -->
      <path d="M 0 24 C 0 10, 24 10, 24 24" class="scallop-line" stroke-width="1.3"/>
      <!-- Inner Scallop Arc -->
      <path d="M 3 24 C 3 14, 21 14, 21 24" class="scallop-line" stroke-width="0.9"/>
      <!-- Radiating Fan Ribs -->
      <line x1="12" y1="24" x2="12" y2="10" class="scallop-line" stroke-width="0.9"/>
      <line x1="12" y1="24" x2="5.5" y2="13" class="scallop-line" stroke-width="0.8"/>
      <line x1="12" y1="24" x2="18.5" y2="13" class="scallop-line" stroke-width="0.8"/>
      <line x1="12" y1="24" x2="1.5" y2="18.5" class="scallop-line" stroke-width="0.7"/>
      <line x1="12" y1="24" x2="22.5" y2="18.5" class="scallop-line" stroke-width="0.7"/>
      <!-- Top Crest Mini-Scallops / Lace Tips -->
      <path d="M 0 24 Q 3 20 6 22 Q 12 16 18 22 Q 21 20 24 24" class="scallop-line" stroke-width="0.8"/>
      <circle cx="12" cy="7.5" r="1.3" class="scallop-fill"/>
      <circle cx="12" cy="24" r="1.5" class="scallop-fill"/>
      <!-- Small Interlacing Base Ring -->
      <circle cx="0" cy="24" r="2.2" class="scallop-line" stroke-width="0.8"/>
      <circle cx="24" cy="24" r="2.2" class="scallop-line" stroke-width="0.8"/>
    </pattern>

    <!-- Bottom Scallop/Fan Unit -->
    <pattern id="scallop-fan-bottom" width="24" height="26" patternUnits="userSpaceOnUse">
      <!-- Fan Arch Inverted -->
      <path d="M 0 2 C 0 16, 24 16, 24 2" class="scallop-line" stroke-width="1.3"/>
      <!-- Inner Scallop Arc -->
      <path d="M 3 2 C 3 12, 21 12, 21 2" class="scallop-line" stroke-width="0.9"/>
      <!-- Radiating Fan Ribs -->
      <line x1="12" y1="2" x2="12" y2="16" class="scallop-line" stroke-width="0.9"/>
      <line x1="12" y1="2" x2="5.5" y2="13" class="scallop-line" stroke-width="0.8"/>
      <line x1="12" y1="2" x2="18.5" y2="13" class="scallop-line" stroke-width="0.8"/>
      <line x1="12" y1="2" x2="1.5" y2="7.5" class="scallop-line" stroke-width="0.7"/>
      <line x1="12" y1="2" x2="22.5" y2="7.5" class="scallop-line" stroke-width="0.7"/>
      <!-- Bottom Crest Mini-Scallops / Lace Tips -->
      <path d="M 0 2 Q 3 6 6 4 Q 12 10 18 4 Q 21 6 24 2" class="scallop-line" stroke-width="0.8"/>
      <circle cx="12" cy="18.5" r="1.3" class="scallop-fill"/>
      <circle cx="12" cy="2" r="1.5" class="scallop-fill"/>
      <!-- Small Interlacing Base Ring -->
      <circle cx="0" cy="2" r="2.2" class="scallop-line" stroke-width="0.8"/>
      <circle cx="24" cy="2" r="2.2" class="scallop-line" stroke-width="0.8"/>
    </pattern>

    <!-- Vertical Left Scallop/Fan Unit -->
    <pattern id="scallop-fan-left" width="26" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 C 10 0, 10 24, 24 24" class="scallop-line" stroke-width="1.3"/>
      <path d="M 24 3 C 14 3, 14 21, 24 21" class="scallop-line" stroke-width="0.9"/>
      <line x1="24" y1="12" x2="10" y2="12" class="scallop-line" stroke-width="0.9"/>
      <line x1="24" y1="12" x2="13" y2="5.5" class="scallop-line" stroke-width="0.8"/>
      <line x1="24" y1="12" x2="13" y2="18.5" class="scallop-line" stroke-width="0.8"/>
      <line x1="24" y1="12" x2="18.5" y2="1.5" class="scallop-line" stroke-width="0.7"/>
      <line x1="24" y1="12" x2="18.5" y2="22.5" class="scallop-line" stroke-width="0.7"/>
      <path d="M 24 0 Q 20 3 22 6 Q 16 12 22 18 Q 20 21 24 24" class="scallop-line" stroke-width="0.8"/>
      <circle cx="7.5" cy="12" r="1.3" class="scallop-fill"/>
      <circle cx="24" cy="12" r="1.5" class="scallop-fill"/>
      <circle cx="24" cy="0" r="2.2" class="scallop-line" stroke-width="0.8"/>
      <circle cx="24" cy="24" r="2.2" class="scallop-line" stroke-width="0.8"/>
    </pattern>

    <!-- Vertical Right Scallop/Fan Unit -->
    <pattern id="scallop-fan-right" width="26" height="24" patternUnits="userSpaceOnUse">
      <path d="M 2 0 C 16 0, 16 24, 2 24" class="scallop-line" stroke-width="1.3"/>
      <path d="M 2 3 C 12 3, 12 21, 2 21" class="scallop-line" stroke-width="0.9"/>
      <line x1="2" y1="12" x2="16" y2="12" class="scallop-line" stroke-width="0.9"/>
      <line x1="2" y1="12" x2="13" y2="5.5" class="scallop-line" stroke-width="0.8"/>
      <line x1="2" y1="12" x2="13" y2="18.5" class="scallop-line" stroke-width="0.8"/>
      <line x1="2" y1="12" x2="7.5" y2="1.5" class="scallop-line" stroke-width="0.7"/>
      <line x1="2" y1="12" x2="7.5" y2="22.5" class="scallop-line" stroke-width="0.7"/>
      <path d="M 2 0 Q 6 3 4 6 Q 10 12 4 18 Q 6 21 2 24" class="scallop-line" stroke-width="0.8"/>
      <circle cx="18.5" cy="12" r="1.3" class="scallop-fill"/>
      <circle cx="2" cy="12" r="1.5" class="scallop-fill"/>
      <circle cx="2" cy="0" r="2.2" class="scallop-line" stroke-width="0.8"/>
      <circle cx="2" cy="24" r="2.2" class="scallop-line" stroke-width="0.8"/>
    </pattern>

    <!-- Top-Left Corner Fan / Rosette (48x48) -->
    <g id="corner-fan-tl">
      <!-- Outer Framing Curves -->
      <path d="M 4 48 L 4 14 Q 4 4 14 4 L 48 4" class="scallop-line" stroke-width="2.2"/>
      <path d="M 8 48 L 8 16 Q 8 8 16 8 L 48 8" class="scallop-line" stroke-width="1.2"/>
      <!-- Inner Rosette Boundary -->
      <path d="M 32 48 L 32 32 L 48 32" class="scallop-line" stroke-width="1.2"/>
      <!-- Quadrant Fan Sunburst from (32, 32) pointing to (8, 8) -->
      <path d="M 32 12 A 20 20 0 0 0 12 32" class="scallop-line" stroke-width="1.4"/>
      <path d="M 32 18 A 14 14 0 0 0 18 32" class="scallop-line" stroke-width="1.0"/>
      <!-- Fan Ribs radiating to corner -->
      <line x1="32" y1="32" x2="12" y2="32" class="scallop-line" stroke-width="1.0"/>
      <line x1="32" y1="32" x2="14.5" y2="24" class="scallop-line" stroke-width="0.9"/>
      <line x1="32" y1="32" x2="18" y2="18" class="scallop-line" stroke-width="1.2"/>
      <line x1="32" y1="32" x2="24" y2="14.5" class="scallop-line" stroke-width="0.9"/>
      <line x1="32" y1="32" x2="32" y2="12" class="scallop-line" stroke-width="1.0"/>
      <!-- Corner Flourish & Pearls -->
      <circle cx="18" cy="18" r="2.2" class="scallop-fill"/>
      <circle cx="32" cy="32" r="3.2" class="scallop-line" stroke-width="1.2"/>
      <circle cx="32" cy="32" r="1.5" class="scallop-fill"/>
      <circle cx="10" cy="10" r="2.0" class="scallop-fill"/>
      <!-- Scallop Pearls along Corner Arc -->
      <circle cx="15" cy="27" r="1.1" class="scallop-fill"/>
      <circle cx="21" cy="21" r="1.3" class="scallop-fill"/>
      <circle cx="27" cy="15" r="1.1" class="scallop-fill"/>
    </g>
  </defs>

  <!-- Outer Double Enclosing Frame -->
  <rect x="4" y="4" width="842" height="642" rx="4" class="scallop-line" stroke-width="2.2"/>
  <rect x="8" y="8" width="834" height="634" rx="2" class="scallop-line" stroke-width="1.0"/>

  <!-- Inner Double Border Frame (Leaves interior completely clear for certificate content) -->
  <rect x="32" y="32" width="786" height="586" class="scallop-line" stroke-width="1.4"/>
  <rect x="35.5" y="35.5" width="779" height="579" class="scallop-line" stroke-width="0.8"/>

  <!-- Repeating Ornamental Scallop/Fan Bands -->
  <!-- Top Border Band -->
  <rect x="48" y="8" width="754" height="24" fill="url(#scallop-fan-top)"/>
  <!-- Bottom Border Band -->
  <rect x="48" y="618" width="754" height="24" fill="url(#scallop-fan-bottom)"/>
  <!-- Left Border Band -->
  <rect x="8" y="48" width="24" height="554" fill="url(#scallop-fan-left)"/>
  <!-- Right Border Band -->
  <rect x="818" y="48" width="24" height="554" fill="url(#scallop-fan-right)"/>

  <!-- Four Ornate Corner Fan Flourishes -->
  <!-- Top-Left -->
  <use href="#corner-fan-tl" x="0" y="0"/>
  <!-- Top-Right -->
  <use href="#corner-fan-tl" x="0" y="0" transform="translate(850, 0) scale(-1, 1)"/>
  <!-- Bottom-Left -->
  <use href="#corner-fan-tl" x="0" y="0" transform="translate(0, 650) scale(1, -1)"/>
  <!-- Bottom-Right -->
  <use href="#corner-fan-tl" x="0" y="0" transform="translate(850, 650) scale(-1, -1)"/>
</svg>
