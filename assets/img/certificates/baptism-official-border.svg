<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Rich Gold Gradients -->
    <linearGradient id="gold-grad-rich" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="25%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#fdf6c7"/>
      <stop offset="75%" stop-color="#aa7c11"/>
      <stop offset="100%" stop-color="#8a6309"/>
    </linearGradient>

    <linearGradient id="gold-metal-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#aa7c11"/>
      <stop offset="30%" stop-color="#fdf6c7"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#fdf6c7"/>
      <stop offset="100%" stop-color="#aa7c11"/>
    </linearGradient>

    <linearGradient id="gold-metal-v" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#aa7c11"/>
      <stop offset="30%" stop-color="#fdf6c7"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#fdf6c7"/>
      <stop offset="100%" stop-color="#aa7c11"/>
    </linearGradient>

    <!-- Deep Regal Maroon Gradient -->
    <linearGradient id="maroon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e0c0c"/>
      <stop offset="35%" stop-color="#731515"/>
      <stop offset="70%" stop-color="#560e0e"/>
      <stop offset="100%" stop-color="#3c0606"/>
    </linearGradient>

    <!-- Soft Antique Parchment Texture Gradient -->
    <radialGradient id="parchment-grad" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#fefdf9" stop-opacity="1"/>
      <stop offset="45%" stop-color="#fbf7ec" stop-opacity="1"/>
      <stop offset="80%" stop-color="#f5ecda" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ebdcc2" stop-opacity="1"/>
    </radialGradient>

    <!-- Filigree Gold Flourish Pattern for Top/Bottom Borders -->
    <pattern id="filigree-h" width="40" height="26" patternUnits="userSpaceOnUse">
      <path d="M 0 13 Q 10 4 20 13 Q 30 22 40 13" fill="none" stroke="url(#gold-grad-rich)" stroke-width="1.3"/>
      <path d="M 0 13 Q 10 22 20 13 Q 30 4 40 13" fill="none" stroke="url(#gold-grad-rich)" stroke-width="1.3"/>
      <circle cx="20" cy="13" r="2.2" fill="#ffd700"/>
      <circle cx="10" cy="9" r="1.2" fill="#d4af37"/>
      <circle cx="10" cy="17" r="1.2" fill="#d4af37"/>
      <circle cx="30" cy="9" r="1.2" fill="#d4af37"/>
      <circle cx="30" cy="17" r="1.2" fill="#d4af37"/>
      <path d="M 20 5 L 20 21 M 12 13 L 28 13" stroke="#ffd700" stroke-width="0.8"/>
    </pattern>

    <!-- Filigree Gold Flourish Pattern for Left/Right Borders -->
    <pattern id="filigree-v" width="26" height="40" patternUnits="userSpaceOnUse">
      <path d="M 13 0 Q 4 10 13 20 Q 22 30 13 40" fill="none" stroke="url(#gold-grad-rich)" stroke-width="1.3"/>
      <path d="M 13 0 Q 22 10 13 20 Q 4 30 13 40" fill="none" stroke="url(#gold-grad-rich)" stroke-width="1.3"/>
      <circle cx="13" cy="20" r="2.2" fill="#ffd700"/>
      <circle cx="9" cy="10" r="1.2" fill="#d4af37"/>
      <circle cx="17" cy="10" r="1.2" fill="#d4af37"/>
      <circle cx="9" cy="30" r="1.2" fill="#d4af37"/>
      <circle cx="17" cy="30" r="1.2" fill="#d4af37"/>
      <path d="M 5 20 L 21 20 M 13 12 L 13 28" stroke="#ffd700" stroke-width="0.8"/>
    </pattern>

    <!-- Corner Rosette Ornament -->
    <g id="corner-rosette">
      <rect x="-24" y="-24" width="48" height="48" fill="url(#maroon-grad)" stroke="url(#gold-grad-rich)" stroke-width="2.5" rx="3"/>
      <rect x="-20" y="-20" width="40" height="40" fill="none" stroke="#fdf6c7" stroke-width="1" rx="2"/>
      <circle cx="0" cy="0" r="14" fill="#560e0e" stroke="url(#gold-grad-rich)" stroke-width="1.8"/>
      <!-- Gold Cross in Corner -->
      <path d="M -3 -11 L 3 -11 L 3 -3 L 11 -3 L 11 3 L 3 3 L 3 11 L -3 11 L -3 3 L -11 3 L -11 -3 L -3 -3 Z" fill="url(#gold-grad-rich)" stroke="#3c0606" stroke-width="0.7"/>
      <circle cx="0" cy="0" r="2.5" fill="#fdf6c7"/>
      <!-- Corner Acanthus Petals -->
      <circle cx="-16" cy="-16" r="2.5" fill="url(#gold-grad-rich)"/>
      <circle cx="16" cy="-16" r="2.5" fill="url(#gold-grad-rich)"/>
      <circle cx="-16" cy="16" r="2.5" fill="url(#gold-grad-rich)"/>
      <circle cx="16" cy="16" r="2.5" fill="url(#gold-grad-rich)"/>
    </g>

    <!-- Mid-Edge Medallion -->
    <g id="midedge-medallion">
      <circle cx="0" cy="0" r="16" fill="url(#maroon-grad)" stroke="url(#gold-grad-rich)" stroke-width="2.2"/>
      <circle cx="0" cy="0" r="12" fill="none" stroke="#ffd700" stroke-width="1"/>
      <path d="M -2.5 -9 L 2.5 -9 L 2.5 -2.5 L 9 -2.5 L 9 2.5 L 2.5 2.5 L 2.5 9 L -2.5 9 L -2.5 2.5 L -9 2.5 L -9 -2.5 L -2.5 -2.5 Z" fill="url(#gold-grad-rich)" stroke="#3c0606" stroke-width="0.6"/>
      <circle cx="0" cy="0" r="2.2" fill="#fdf6c7"/>
    </g>
  </defs>

  <!-- Base Parchment Background Inside Sheet -->
  <rect x="0" y="0" width="800" height="1000" fill="url(#parchment-grad)"/>

  <!-- ==================== OUTER DECORATIVE BORDER ==================== -->
  <!-- Outer Maroon Band -->
  <rect x="14" y="14" width="772" height="972" fill="url(#maroon-grad)" stroke="url(#gold-grad-rich)" stroke-width="3" rx="4"/>
  
  <!-- Outer Pinstripe within Maroon Band -->
  <rect x="18" y="18" width="764" height="964" fill="none" stroke="#aa7c11" stroke-width="0.9" rx="3"/>

  <!-- Filigree Scrolling Patterns on Border Band -->
  <!-- Top Horizontal Filigree -->
  <rect x="52" y="16" width="696" height="24" fill="url(#filigree-h)"/>
  <!-- Bottom Horizontal Filigree -->
  <rect x="52" y="960" width="696" height="24" fill="url(#filigree-h)"/>
  <!-- Left Vertical Filigree -->
  <rect x="16" y="52" width="24" height="896" fill="url(#filigree-v)"/>
  <!-- Right Vertical Filigree -->
  <rect x="760" y="52" width="24" height="896" fill="url(#filigree-v)"/>

  <!-- Inner Trim of the Maroon Band (Gold Border) -->
  <rect x="42" y="42" width="716" height="916" fill="none" stroke="url(#gold-grad-rich)" stroke-width="2.5"/>
  <rect x="45.5" y="45.5" width="709" height="909" fill="none" stroke="#731515" stroke-width="1.2"/>
  <rect x="48" y="48" width="704" height="904" fill="none" stroke="url(#gold-metal-h)" stroke-width="1"/>

  <!-- Inner Parchment Body Area -->
  <rect x="49" y="49" width="702" height="902" fill="url(#parchment-grad)"/>

  <!-- Secondary Inner Pinstripe Frame -->
  <rect x="54" y="54" width="692" height="892" fill="none" stroke="rgba(115, 21, 21, 0.4)" stroke-width="0.8"/>
  <rect x="56" y="56" width="688" height="888" fill="none" stroke="rgba(212, 175, 55, 0.45)" stroke-width="0.6"/>

  <!-- Four Ornate Corner Rosettes -->
  <use href="#corner-rosette" x="29" y="29"/>
  <use href="#corner-rosette" x="771" y="29"/>
  <use href="#corner-rosette" x="29" y="971"/>
  <use href="#corner-rosette" x="771" y="971"/>

  <!-- Mid-Edge Medallions on Border -->
  <use href="#midedge-medallion" x="400" y="28"/>
  <use href="#midedge-medallion" x="400" y="972"/>
  <use href="#midedge-medallion" x="28" y="500"/>
  <use href="#midedge-medallion" x="772" y="500"/>

  <!-- ==================== CENTER WATERMARK (Cross & Holy Spirit Dove) ==================== -->
  <g id="center-watermark" transform="translate(400, 520)" opacity="0.13" pointer-events="none">
    <!-- Radiant Solar Rays -->
    <g stroke="#b8860b" stroke-width="1.4" opacity="0.6">
      <line x1="0" y1="-140" x2="0" y2="140"/>
      <line x1="-140" y1="0" x2="140" y2="0"/>
      <line x1="-100" y1="-100" x2="100" y2="100"/>
      <line x1="100" y1="-100" x2="-100" y2="100"/>
      <line x1="-50" y1="-130" x2="50" y2="130" stroke-width="0.8"/>
      <line x1="50" y1="-130" x2="-50" y2="130" stroke-width="0.8"/>
      <line x1="-130" y1="-50" x2="130" y2="50" stroke-width="0.8"/>
      <line x1="130" y1="-50" x2="-130" y2="50" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="95" fill="none" stroke="#b8860b" stroke-width="0.9" stroke-dasharray="4 4"/>
      <circle cx="0" cy="0" r="120" fill="none" stroke="#b8860b" stroke-width="0.6" stroke-dasharray="2 3"/>
    </g>

    <!-- Beveled Latin Cross in Watermark -->
    <path d="M -16 -160 L 16 -160 L 16 -50 L 95 -50 L 95 -18 L 16 -18 L 16 160 L -16 160 L -16 -18 L -95 -18 L -95 -50 L -16 -50 Z" 
          fill="#cda250" stroke="#8b5a00" stroke-width="1.8" opacity="0.75"/>
    <path d="M 0 -160 L 16 -160 L 16 -50 L 95 -50 L 95 -18 L 16 -18 L 16 160 L 0 160 Z" 
          fill="#996515" opacity="0.25"/>

    <!-- Holy Spirit Dove with Outstretched Wings -->
    <g transform="translate(0, 15) scale(1.15)">
      <!-- Left Wing -->
      <path d="M 0 0 C -25 -25, -65 -45, -95 -35 C -90 -20, -75 -5, -60 10 C -45 20, -25 25, 0 25 Z" fill="#996515"/>
      <path d="M -15 -10 C -40 -30, -75 -40, -100 -25 C -85 -5, -55 15, -15 20 Z" fill="#b8860b" opacity="0.6"/>
      <!-- Right Wing -->
      <path d="M 0 0 C 25 -25, 65 -45, 95 -35 C 90 -20, 75 -5, 60 10 C 45 20, 25 25, 0 25 Z" fill="#996515"/>
      <path d="M 15 -10 C 40 -30, 75 -40, 100 -25 C 85 -5, 55 15, 15 20 Z" fill="#b8860b" opacity="0.6"/>
      <!-- Body & Tail -->
      <path d="M 0 -25 C -12 -15, -14 15, -20 45 C -10 40, 10 40, 20 45 C 14 15, 12 -15, 0 -25 Z" fill="#8a5700"/>
      <!-- Head & Beak -->
      <circle cx="0" cy="-28" r="9" fill="#8a5700"/>
      <path d="M 0 -37 L 0 -44 L 4 -36 Z" fill="#aa7c11"/>
      <circle cx="3" cy="-30" r="1.5" fill="#fdf6c7"/>
    </g>
  </g>

  <!-- ==================== DIAGONAL WATERMARK TEXT ==================== -->
  <g transform="translate(400, 520) rotate(-28)" opacity="0.09" pointer-events="none">
    <text x="0" y="0" 
          font-family="Georgia, 'Times New Roman', serif" 
          font-size="46" 
          font-weight="bold" 
          font-style="italic" 
          letter-spacing="5" 
          fill="#8c6427" 
          text-anchor="middle">
      Valid Parish Document
    </text>
  </g>

  <!-- ==================== BOTTOM EMBLEMS ==================== -->
  <!-- Gold Latin Cross next to Seal Area (Bottom-Left) -->
  <g transform="translate(230, 875) scale(0.75)" opacity="0.75">
    <!-- Cross Shadow -->
    <path d="M -9 -45 L 9 -45 L 9 -12 L 32 -12 L 32 6 L 9 6 L 9 45 L -9 45 L -9 6 L -32 6 L -32 -12 L -9 -12 Z" 
          fill="none" stroke="#d4af37" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M -8 -44 L 8 -44 L 8 -11 L 31 -11 L 31 5 L 8 5 L 8 44 L -8 44 L -8 5 L -31 5 L -31 -11 L -8 -11 Z" 
          fill="url(#gold-grad-rich)" stroke="#8a5700" stroke-width="1.2"/>
    <path d="M 0 -44 L 8 -44 L 8 -11 L 31 -11 L 31 5 L 8 5 L 8 44 L 0 44 Z" 
          fill="#aa7c11" opacity="0.3"/>
    <circle cx="0" cy="-3" r="3" fill="#fdf6c7"/>
  </g>
</svg>
