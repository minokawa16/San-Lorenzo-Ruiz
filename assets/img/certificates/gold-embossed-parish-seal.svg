<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <!-- Metallic Gold Radial Gradient -->
    <radialGradient id="goldRadial" cx="42%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#fff6d1"/>
      <stop offset="25%" stop-color="#f5d77f"/>
      <stop offset="55%" stop-color="#c89b3c"/>
      <stop offset="85%" stop-color="#9a711c"/>
      <stop offset="100%" stop-color="#6d4e0d"/>
    </radialGradient>

    <!-- Linear Highlight Gradient -->
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8db" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#dfb75c" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#9a711c" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffe699" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Soft Emboss Drop Shadow Filter -->
    <filter id="sealShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#3d2a06" flood-opacity="0.35"/>
    </filter>

    <path id="sealTextPathTop" d="M 28 80 A 52 52 0 0 1 132 80" fill="none"/>
    <path id="sealTextPathBottom" d="M 132 80 A 52 52 0 0 1 28 80" fill="none"/>
  </defs>

  <g filter="url(#sealShadow)">
    <!-- 36-Point Serrated Ribbon Rim -->
    <path d="
      M 80 8  L 83 14 L 89 9  L 91 16 L 98 12 L 99 20 L 107 17 L 106 25 L 114 24 L 112 32 L 120 32 L 117 40 
      L 125 42 L 120 49 L 128 53 L 122 59 L 129 64 L 122 70 L 129 76 L 121 80 L 129 84 L 122 90 L 129 96 
      L 122 101 L 128 107 L 120 111 L 125 118 L 117 120 L 120 128 L 112 128 L 114 136 L 106 135 L 107 143 
      L 99 140 L 98 148 L 91 144 L 89 151 L 83 146 L 80 152 L 77 146 L 71 151 L 69 144 L 62 148 L 61 140 
      L 53 143 L 54 135 L 46 136 L 48 128 L 40 128 L 43 120 L 35 118 L 40 111 L 32 107 L 38 101 L 31 96 
      L 38 90 L 31 84 L 39 80 L 31 76 L 38 70 L 31 64 L 38 59 L 32 53 L 40 49 L 35 42 L 43 40 L 40 32 
      L 48 32 L 46 24 L 54 25 L 53 17 L 61 20 L 62 12 L 69 16 L 71 9  L 77 14 Z" 
      fill="url(#goldRadial)" stroke="#875f11" stroke-width="1.2"/>

    <!-- Outer Beaded Ring -->
    <circle cx="80" cy="80" r="63" fill="none" stroke="#ffe58f" stroke-width="1.8" opacity="0.9"/>
    <circle cx="80" cy="80" r="60" fill="none" stroke="#7a5309" stroke-width="1" stroke-dasharray="2.5 2"/>

    <!-- Inner Core Disc -->
    <circle cx="80" cy="80" r="54" fill="url(#goldRadial)" stroke="#ffe58f" stroke-width="1.5"/>
    <circle cx="80" cy="80" r="50" fill="url(#goldSheen)" stroke="#875f11" stroke-width="0.8"/>

    <!-- Embossed Latin Cross Center -->
    <g transform="translate(80, 52)">
      <path d="M -2.5 0 L 2.5 0 L 2.5 4 L 7 4 L 7 8 L 2.5 8 L 2.5 24 L -2.5 24 L -2.5 8 L -7 8 L -7 4 L -2.5 4 Z" 
            fill="#5c3f07" filter="drop-shadow(0 1px 1px #fff4bf)"/>
      <path d="M -2.2 0.3 L 2.2 0.3 L 2.2 4.3 L 6.7 4.3 L 6.7 7.7 L 2.2 7.7 L 2.2 23.7 L -2.2 23.7 L -2.2 7.7 L -6.7 7.7 L -6.7 4.3 L -2.2 4.3 Z" 
            fill="#ffe899"/>
    </g>

    <!-- Embossed Inscriptions -->
    <text font-family="'Cinzel', Georgia, serif" font-size="10.5px" font-weight="800" fill="#4d3403" text-anchor="middle" letter-spacing="1.5px">
      <textPath href="#sealTextPathTop" startOffset="50%" text-anchor="middle">PARISH SEAL</textPath>
    </text>
    <text font-family="'Cinzel', Georgia, serif" font-size="10.5px" font-weight="800" fill="#fff4bf" text-anchor="middle" letter-spacing="1.5px" dy="-0.6">
      <textPath href="#sealTextPathTop" startOffset="50%" text-anchor="middle">PARISH SEAL</textPath>
    </text>

    <text font-family="'Cinzel', Georgia, serif" font-size="9.5px" font-weight="700" fill="#4d3403" text-anchor="middle" letter-spacing="2px">
      <textPath href="#sealTextPathBottom" startOffset="50%" text-anchor="middle">ALEOSAN</textPath>
    </text>
    <text font-family="'Cinzel', Georgia, serif" font-size="9.5px" font-weight="700" fill="#fff4bf" text-anchor="middle" letter-spacing="2px" dy="-0.6">
      <textPath href="#sealTextPathBottom" startOffset="50%" text-anchor="middle">ALEOSAN</textPath>
    </text>

    <!-- Center Stars -->
    <text x="80" y="94" font-size="10px" fill="#ffeaa3" text-anchor="middle" filter="drop-shadow(0 1px 0 #5c3f07)">★ ★ ★</text>
  </g>
</svg>
